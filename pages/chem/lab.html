<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body data-sidebar-state="expanded">
    <button class="sidebar-reveal" type="button" data-sidebar-show aria-label="Mostrar barra lateral"
        title="Mostrar barra lateral">
        <span aria-hidden="true">&rsaquo;</span>
    </button>

    <aside class="sidebar" id="chem-lab-sidebar">
        <header class="sidebar-header">
            <div class="sidebar-logo">
                <img src="../../assets/icons/devchem_icon.svg" alt="">
            </div>

            <div class="sidebar-brand">
                <strong>CHEM LAB</strong>
                <span>Scientific workspace</span>
            </div>

            <button class="sidebar-resize" type="button" data-sidebar-resize aria-label="Recolher barra lateral"
                aria-controls="chem-lab-sidebar" aria-expanded="true" title="Recolher barra lateral">
                <span aria-hidden="true">&lsaquo;</span>
            </button>
        </header>

        <nav class="sidebar-navigation" aria-label="Ferramentas do Chem Lab">
            <section class="sidebar-group">
                <h2>Geral</h2>

                <button class="sidebar-item is-active" type="button" data-tool="overview" aria-current="page"
                    title="Visão geral">
                    <span class="sidebar-item-icon" aria-hidden="true">⌂</span>
                    <span class="sidebar-item-label">General Vision</span>
                </button>
            </section>

            <section class="sidebar-group">
                <h2>Tools</h2>

                <button class="sidebar-item" type="button" data-tool="data-entry" title="Entrada de dados">
                    <span class="sidebar-item-icon" aria-hidden="true">＋</span>
                    <span class="sidebar-item-label">DataEntry</span>
                </button>

                <button class="sidebar-item" type="button" data-tool="analysis" title="Análise">
                    <span class="sidebar-item-icon" aria-hidden="true">∿</span>
                    <span class="sidebar-item-label">Analise</span>
                </button>

                <button class="sidebar-item" type="button" data-tool="docs" title="Documentação">
                    <span class="sidebar-item-icon" aria-hidden="true">▤</span>
                    <span class="sidebar-item-label">Documentation</span>
                </button>
            </section>
        </nav>

        <footer class="sidebar-footer">
            <button class="sidebar-hide" type="button" data-sidebar-hide aria-label="Ocultar barra lateral"
                title="Ocultar barra lateral">
                <span class="sidebar-item-icon" aria-hidden="true">&laquo;</span>
                <span class="sidebar-item-label">close bar</span>
            </button>
        </footer>
    </aside>

    <header class="header">
        <div class="header-content">
            <a href="../../index.html" class="logo">Logo</a>
            <nav class="nav">
                <ul>
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="../chem/projects.html">Projects</a></li>
                    <li><a href="../chem/lab.html">Lab</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-page dashboard-panels">
        <h1 id="page-title">Chem Lab</h1>
        <section class="content-grid" id="lab-content">
            <p>Loading...</p>
        </section>
    </main>

    <template id="painel-template">
        <section class="panel" data-panel>
            <header class="panel-header">
                <h2 class="panel-title" data-panel-title></h2>
                <div class="panel_actions">
                    <button type="button" data-panel-close>x</button>
                    <button type="button" data-panel-minimize>-</button>
                </div>
            </header>
            <div class="panel-content" data-panel-content>
                <p>Panel content goes here...</p>
            </div>
        </section>
    </template>

    <script src="../../assets/js/chem/sidebar.js"></script>
    <script src="../../assets/js/chem/lab.js"></script>
